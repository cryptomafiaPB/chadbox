services:
    chadbox-api:
        build: .
        container_name: chadbox_api
        privileged: true
        environment:
            CI: 'true'
            CHADBOX_SAFE_BASELINE: '${CHADBOX_SAFE_BASELINE:-}'
            CHADBOX_MAX_QUEUE_DEPTH: '${CHADBOX_MAX_QUEUE_DEPTH:-}'
            CHADBOX_PANIC_MEMORY_MB: '${CHADBOX_PANIC_MEMORY_MB:-}'
            CHADBOX_BOX_POOL_MIN: '${CHADBOX_BOX_POOL_MIN:-}'
            CHADBOX_BOX_POOL_MAX: '${CHADBOX_BOX_POOL_MAX:-}'
            CHADBOX_MEM_POLL_INTERVAL_MS: '${CHADBOX_MEM_POLL_INTERVAL_MS:-}'
            CHADBOX_MAX_MOUNTS: '${CHADBOX_MAX_MOUNTS:-}'
            CHADBOX_IDLE_TIMEOUT_MS: '${CHADBOX_IDLE_TIMEOUT_MS:-}'
            CHADBOX_SWEEPER_INTERVAL_MS: '${CHADBOX_SWEEPER_INTERVAL_MS:-}'
            CHADBOX_STORAGE_DIR: '${CHADBOX_STORAGE_DIR:-}'
            CHADBOX_MOUNTS_DIR: '${CHADBOX_MOUNTS_DIR:-}'
            CHADBOX_ALLOWED_LANGUAGES: '${CHADBOX_ALLOWED_LANGUAGES:-}'
            CHADBOX_DISABLED_LANGUAGES: '${CHADBOX_DISABLED_LANGUAGES:-}'
            CHADBOX_DEFAULT_COMPILE_TIMEOUT_MS: '${CHADBOX_DEFAULT_COMPILE_TIMEOUT_MS:-}'
            CHADBOX_MAX_COMPILE_TIMEOUT_MS: '${CHADBOX_MAX_COMPILE_TIMEOUT_MS:-}'
            CHADBOX_DEFAULT_RUN_TIMEOUT_MS: '${CHADBOX_DEFAULT_RUN_TIMEOUT_MS:-}'
            CHADBOX_MAX_RUN_TIMEOUT_MS: '${CHADBOX_MAX_RUN_TIMEOUT_MS:-}'
            CHADBOX_DEFAULT_COMPILE_MEMORY_KB: '${CHADBOX_DEFAULT_COMPILE_MEMORY_KB:-}'
            CHADBOX_MAX_COMPILE_MEMORY_KB: '${CHADBOX_MAX_COMPILE_MEMORY_KB:-}'
            CHADBOX_DEFAULT_RUN_MEMORY_KB: '${CHADBOX_DEFAULT_RUN_MEMORY_KB:-}'
            CHADBOX_MAX_RUN_MEMORY_KB: '${CHADBOX_MAX_RUN_MEMORY_KB:-}'
            CHADBOX_MAX_PROCESSES_COMPILE: '${CHADBOX_MAX_PROCESSES_COMPILE:-}'
            CHADBOX_MAX_PROCESSES_RUN: '${CHADBOX_MAX_PROCESSES_RUN:-}'
            CHADBOX_MAX_FSIZE_COMPILE_KB: '${CHADBOX_MAX_FSIZE_COMPILE_KB:-}'
            CHADBOX_MAX_FSIZE_RUN_KB: '${CHADBOX_MAX_FSIZE_RUN_KB:-}'
            CHADBOX_MAX_OUTPUT_BYTES: '${CHADBOX_MAX_OUTPUT_BYTES:-}'
        volumes:
            - .:/app
            # Keep dependency trees inside Linux volumes
            - chadbox_root_node_modules:/app/node_modules
            - chadbox_api_node_modules:/app/packages/api/node_modules
            - chadbox_core_node_modules:/app/packages/core/node_modules
            - chadbox_shared_node_modules:/app/packages/shared/node_modules
            - chadbox_cli_node_modules:/app/packages/cli/node_modules
        working_dir: /app
        # Setup command that creates wrapper script 'chad' to run the CLI from the host, and then starts the development server.
        command: |
            sh -ec '
            cat > /usr/local/bin/chad <<"EOF"
            #!/bin/sh
            exec pnpm --filter @chadbox/cli run start "$@"
            EOF
            chmod +x /usr/local/bin/chad
            pnpm install --frozen-lockfile
            pnpm build
            pnpm run start
            '
        ports:
            - '3000:3000'

volumes:
    chadbox_root_node_modules:
    chadbox_api_node_modules:
    chadbox_core_node_modules:
    chadbox_shared_node_modules:
    chadbox_cli_node_modules:
